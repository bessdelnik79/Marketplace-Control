 mobile / desktop</tspan></text><text data-name="Spacing" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#68758C" text-anchor="start"><tspan x="48" y="706">Отступы: 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 px</tspan><tspan x="48" y="732.1">Радиусы: 8–12 px. Разделители: 1 px.</tspan></text><text data-name="Notes" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#122044" text-anchor="start"><tspan x="48" y="824">Три верхних блока: прибыль, сейчас, требует внимания.</tspan><tspan x="48" y="850.1">Нижняя половина desktop: что проверить и контрольные точки.</tspan><tspan x="48" y="876.2">Неполнота финансовых данных всегда обозначена рядом с прибылью.</tspan></text></g></svg>