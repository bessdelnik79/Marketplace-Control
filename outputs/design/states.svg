t-weight="600" fill="#122044" text-anchor="start"><tspan x="20" y="36">База сравнения</tspan></text><text data-name="Explanation" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#68758C" text-anchor="start"><tspan x="20" y="69">В среднем: 34 заказа · 62 100 ₽</tspan><tspan x="20" y="89.3">за сопоставимые 6 дней. Для каждого дня</tspan><tspan x="20" y="109.6">среднее по 4 предыдущим периодам.</tspan></text></g><g data-name="No urgent situations" transform="translate(960 144)"><rect width="430" height="154" rx="12" fill="#F6F8FC"/><text data-name="Title" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#122044" text-anchor="start"><tspan x="20" y="38">Срочных ситуаций нет</tspan></text><text data-name="Context" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#68758C" text-anchor="start"><tspan x="20" y="74">По доступным данным.</tspan><tspan x="20" y="94.3">Рекомендованные проверки остаются ниже.</tspan></text></g><g data-name="Buyouts state" transform="translate(490 350)"><rect width="414" height="168" rx="12" fill="#F6F8FC"/><text data-name="Tabs" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#0866FF" text-anchor="start"><tspan x="20" y="36">Заказы       Выкупы</tspan></text><text data-name="Metric" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#122044" text-anchor="start"><tspan x="20" y="95">31 шт. · 58 400 ₽</tspan></text><text data-name="Context" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#68758C" text-anchor="start"><tspan x="20" y="128">Сравнение с историей выкупов, не заказов.</tspan></text></g><text data-name="Many situations heading" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#122044" text-anchor="start"><tspan x="40" y="602">Много ситуаций: короткий список + переход ко всем</tspan></text><g data-name="More urgent 1" transform="translate(40 642)"><ellipse data-name="Urgency" cx="15" cy="21" rx="15" ry="15" fill="#C9353E"/><text data-name="Mark" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan x="15" y="26">!</tspan></text><text data-name="Title" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#122044" text-anchor="start"><tspan x="50" y="22">Убыток до продвижения</tspan></text><text data-name="Fact" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#C9353E" text-anchor="start"><tspan x="50" y="54">−18 400 ₽</tspan></text><text data-name="Context" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#68758C" text-anchor="start"><tspan x="50" y="81">За неделю 1–7 сентября</tspan></text><path data-name="Details" transform="translate(636 42)" d="M8 5L15 12L8 19" fill="none" stroke="#0866FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect data-name="Divider" x="0" y="113" width="660" height="1" rx="0" fill="#E2E8F1"/></g><g data-name="More urgent 2" transform="translate(40 770)"><ellipse data-name="Urgency" cx="15" cy="21" rx="15" ry="15" fill="#C9353E"/><text data-name="Mark" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan x="15" y="26">!</tspan></text><text data-name="Title" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#122044" text-anchor="start"><tspan x="50" y="22">Штрафы и пени</tspan></text><text data-name="Fact" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#C9353E" text-anchor="start"><tspan x="50" y="54">12 480 ₽</tspan></text><text data-name="Context" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#68758C" text-anchor="start"><tspan x="50" y="81">Новые начисления</tspan></text><path data-name="Details" transform="translate(636 42)" d="M8 5L15 12L8 19" fill="none" stroke="#0866FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect data-name="Divider" x="0" y="113" width="660" height="1" rx="0" fill="#E2E8F1"/></g><text data-name="All urgent" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#0866FF" text-anchor="start"><tspan x="40" y="931">Все срочные ситуации (8)  →</tspan></text><text data-name="State rules" xml:space="preserve" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#68758C" text-anchor="start"><tspan x="780" y="666">Не растягивать карточки при отсутствии алармов.</tspan><tspan x="780" y="689.2">При большом числе проблем показывать приоритетные,</tspan><tspan x="780" y="712.4">сохранять счётчик и переход ко всем.</tspan><tspan x="780" y="735.6"></tspan><tspan x="780" y="758.8">Календарь прибыли и календарь «Сейчас» независимы.</tspan><tspan x="780" y="782">«Заказы / Выкупы» переключает один показатель.</tspan><tspan x="780" y="805.2">Стрелок перехода между периодами нет.</tspan><tspan x="780" y="828.4"></tspan><tspan x="780" y="851.6">В мобильной версии справка открывается нажатием.</tspan><tspan x="780" y="874.8">Диаграммы — только исторические факты.</tspan></text></g></svg>