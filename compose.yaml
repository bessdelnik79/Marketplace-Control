name: marketplace-control
services:
  marketplace-control:
    image: marketplace-control
    build: .
    container_name: marketplace-control
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_control}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace_control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_control_local}
      DATABASE_URL: postgres://${POSTGRES_USER:-marketplace_control}:${POSTGRES_PASSWORD:-marketplace_control_local}@127.0.0.1:5432/${POSTGRES_DB:-marketplace_control}
      PORT: 3000
      NODE_ENV: development
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Marketplace Control <no-reply@example.ru>}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      SMARTCAPTCHA_CLIENT_KEY: ${SMARTCAPTCHA_CLIENT_KEY:-}
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && curl --fail --silent http://127.0.0.1:3000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
volumes:
  postgres_data:
